<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    width: 1024px;
    height: 1024px;
    background: transparent;
    overflow: hidden;
  }
  .icon {
    position: relative;
    width: 1024px;
    height: 1024px;
    border-radius: 232px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 78% 108%, rgba(56, 189, 248, .28) 0%, rgba(99, 102, 241, 0) 62%),
      radial-gradient(90% 80% at 12% -12%, rgba(255, 255, 255, .12) 0%, rgba(255, 255, 255, 0) 58%),
      linear-gradient(158deg, #1e293b 0%, #0f172a 46%, #020617 100%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }
  /* 顶部一层轻薄高光，模拟 macOS 图标材质 */
  .icon::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 48%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  .play {
    position: relative;
    width: 396px;
    height: 396px;
    border-radius: 124px;
    background: linear-gradient(145deg, #38bdf8 0%, #2563eb 52%, #4f46e5 100%);
    box-shadow:
      0 34px 80px rgba(37, 99, 235, .48),
      inset 0 3px 2px rgba(255, 255, 255, .5),
      inset 0 -8px 22px rgba(15, 23, 42, .4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .triangle {
    width: 0;
    height: 0;
    margin-left: 26px;
    border-top: 92px solid transparent;
    border-bottom: 92px solid transparent;
    border-left: 152px solid #ffffff;
    filter: drop-shadow(0 6px 14px rgba(15, 23, 42, .38));
  }
  .brand-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .word {
    position: relative;
    font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, sans-serif;
    font-size: 132px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #f8fafc;
    text-shadow: 0 8px 26px rgba(0, 0, 0, .55);
  }
  .word em {
    font-style: normal;
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub-word {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 16px;
    color: rgba(226, 232, 240, 0.6);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    padding-left: 16px;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="play"><div class="triangle"></div></div>
    <div class="brand-wrap">
      <div class="word">影<em>悦</em></div>
      <div class="sub-word">CINEMAJOY</div>
    </div>
  </div>
</body>
</html>
